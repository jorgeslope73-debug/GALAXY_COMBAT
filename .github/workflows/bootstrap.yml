name: Bootstrap Galaxy Combat source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  copy-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pruebas
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy Galaxy Combat base
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/jorgeslope73-debug/galaxy-combat-web.git /tmp/source
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --exclude '.git' --exclude '.github' /tmp/source/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Copiar base de Galaxy Combat para pruebas P2P"
          git push origin main
