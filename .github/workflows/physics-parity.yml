name: Physics parity

on:
  push:
    paths:
      - 'docs/host-physics.js'
      - 'docs/local-cpu.js'
      - 'docs/physics-core.js'
      - 'docs/p2p-network.js'
      - 'docs/game.js'
      - 'docs/menu-loader.js'
      - 'docs/pwa.js'
      - 'docs/build-version.js'
      - 'docs/index.html'
      - 'docs/cpu-training.html'
      - 'docs/sw.js'
      - 'tools/check-physics-parity.js'
      - 'tools/check-game-invariants.js'
      - 'tools/stress-game.js'
      - '.github/workflows/physics-parity.yml'
  pull_request:
    paths:
      - 'docs/host-physics.js'
      - 'docs/local-cpu.js'
      - 'docs/physics-core.js'
      - 'docs/p2p-network.js'
      - 'docs/game.js'
      - 'docs/menu-loader.js'
      - 'docs/pwa.js'
      - 'docs/build-version.js'
      - 'docs/index.html'
      - 'docs/cpu-training.html'
      - 'docs/sw.js'
      - 'tools/check-physics-parity.js'
      - 'tools/check-game-invariants.js'
      - 'tools/stress-game.js'
      - '.github/workflows/physics-parity.yml'
  workflow_dispatch:

jobs:
  shared-physics-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check runtime syntax
        run: node --check docs/p2p-network.js && node --check docs/menu-loader.js && node --check docs/game.js && node --check docs/pwa.js && node --check docs/build-version.js && node --check docs/sw.js && node --check tools/check-game-invariants.js && node --check tools/stress-game.js
      - name: Check host/local shared physics parity
        run: node tools/check-physics-parity.js
      - name: Check gameplay and performance invariants
        run: node tools/check-game-invariants.js
      - name: Run 5-minute simulated gameplay stress
        env:
          STRESS_SECONDS: 300
        run: node tools/stress-game.js
